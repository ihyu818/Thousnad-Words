<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英語千字王-11 互動測驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 防止在手寫板上畫畫時螢幕跟著捲動 */
        #drawing-pad {
            touch-action: none;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 2 / 1;
            cursor: crosshair;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <div class="max-w-2xl mx-auto p-4 py-8">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">英語千字王 - 第十一關</h1>

        <!-- 設定區域 -->
        <div id="setup-section" class="bg-white p-6 rounded-xl shadow-md text-center">
            <h2 class="text-xl mb-4 font-semibold">測驗設定</h2>
            <div class="mb-4">
                <label for="target-count" class="mr-2">每個單字需要答對次數：</label>
                <input type="number" id="target-count" value="1" min="1" max="10" class="border-2 border-blue-300 rounded px-3 py-1 w-20 text-center text-lg focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="startGame()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                開始測驗
            </button>
        </div>

        <!-- 測驗區域 -->
        <div id="quiz-section" class="bg-white p-6 rounded-xl shadow-md hidden">
            <div class="flex justify-between items-center mb-4 text-sm text-gray-500">
                <span id="progress-text">剩餘單字：25</span>
                <span id="current-word-target">目標次數：0/1</span>
            </div>

            <div class="text-center mb-6">
                <p class="text-gray-500 mb-1">請拼出以下中文的英文單字：</p>
                <h2 id="question-text" class="text-4xl font-bold text-gray-800 tracking-wide">中文</h2>
            </div>

            <!-- 鍵盤輸入區 -->
            <div class="mb-6 flex justify-center">
                <input type="text" id="answer-input" placeholder="點此打字..." autocomplete="off" autocapitalize="off" spellcheck="false" class="border-b-4 border-blue-400 bg-gray-50 text-center text-2xl py-2 px-4 w-full max-w-xs focus:outline-none focus:border-blue-600 transition" onkeypress="handleKeyPress(event)">
                <button onclick="submitAnswer()" class="ml-4 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                    送出
                </button>
            </div>

            <div id="feedback" class="text-center text-xl font-bold min-h-[2rem] mb-4"></div>

            <hr class="my-6">

            <!-- 手寫板區域 -->
            <div class="text-center">
                <h3 class="text-lg font-semibold text-gray-600 mb-1">或使用手寫輸入</h3>
                <p class="text-sm text-gray-400 mb-3">請寫小寫印刷體，字寫大一點，可以連續寫完整個單字</p>
                <div class="flex justify-center mb-3">
                    <canvas id="drawing-pad" width="600" height="300" class="border-2 border-gray-300 rounded-lg bg-white shadow-inner"></canvas>
                </div>
                <div class="flex justify-center gap-4">
                    <button onclick="clearCanvas()" class="bg-gray-400 hover:bg-gray-500 text-white py-1 px-4 rounded transition duration-200">清除重寫</button>
                    <button id="ocr-btn" onclick="recognizeAndSubmit()" class="bg-indigo-500 hover:bg-indigo-600 disabled:opacity-60 text-white py-1 px-4 rounded transition duration-200 flex items-center">
                        <span id="ocr-btn-text">辨識並送出解答</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 完成畫面 -->
        <div id="finish-section" class="bg-white p-8 rounded-xl shadow-md hidden text-center">
            <h2 class="text-4xl font-bold text-green-500 mb-4">🎉 恭喜過關！</h2>
            <p class="text-lg mb-6">你已經成功將所有單字練習完畢！</p>
            <button onclick="location.reload()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                重新測驗
            </button>
        </div>
    </div>

    <script>
        // 詞彙表資料
        const rawVocab = [
            { en: "one", zh: "一/一個" },
            { en: "open", zh: "打開" },
            { en: "or", zh: "或者" },
            { en: "orange", zh: "柳丁" },
            { en: "out", zh: "出去" },
            { en: "outside", zh: "外面" },
            { en: "over", zh: "在..之上;結束" },
            { en: "pants", zh: "褲子" },
            { en: "paper", zh: "紙" },
            { en: "park", zh: "公園" },
            { en: "party", zh: "宴會" },
            { en: "pass", zh: "通過;經過" },
            { en: "PE", zh: "體育課" },
            { en: "pen", zh: "筆" },
            { en: "pencil", zh: "鉛筆" },
            { en: "pet", zh: "寵物" },
            { en: "piano", zh: "鋼琴" },
            { en: "pick", zh: "撿拾" },
            { en: "pie", zh: "派" },
            { en: "pig", zh: "豬" },
            { en: "pink", zh: "粉紅色" },
            { en: "pizza", zh: "披薩" },
            { en: "play", zh: "玩" },
            { en: "p.m.", zh: "午後" },
            { en: "poor", zh: "貧窮的;可憐的" }
        ];

        let wordPool = [];
        let currentWord = null;
        let targetPerWord = 1;
        let locked = false; // 答對後切換下一題的空檔，避免重複送出

        // 比對前的正規化：只保留 a-z（忽略大小寫、句點、空白）
        function normalize(s) {
            return String(s).toLowerCase().replace(/[^a-z]/g, '');
        }

        // --- 手寫板相關變數 ---
        const canvas = document.getElementById('drawing-pad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let strokes = [];        // 筆畫軌跡：[[xs, ys, ts], ...]，每一筆一組
        let currentStroke = null;
        let strokeStartTime = 0;

        function resetCanvasStyle() {
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = 'black';
        }

        function clearCanvas() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            resetCanvasStyle();
            strokes = [];
            currentStroke = null;
            isDrawing = false;
        }
        clearCanvas();

        // --- 遊戲邏輯 ---

        function startGame() {
            targetPerWord = parseInt(document.getElementById('target-count').value) || 1;
            if (targetPerWord < 1) targetPerWord = 1;

            wordPool = rawVocab.map(word => ({
                ...word,
                correctCount: 0
            }));

            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');

            nextQuestion();
        }

        function nextQuestion() {
            locked = false;
            // 過濾掉已經達到目標次數的單字
            wordPool = wordPool.filter(w => w.correctCount < targetPerWord);

            if (wordPool.length === 0) {
                document.getElementById('quiz-section').classList.add('hidden');
                document.getElementById('finish-section').classList.remove('hidden');
                return;
            }

            // 隨機抽選
            const randomIndex = Math.floor(Math.random() * wordPool.length);
            currentWord = wordPool[randomIndex];

            // 更新 UI
            document.getElementById('question-text').innerText = currentWord.zh;
            document.getElementById('progress-text').innerText = `剩餘單字：${wordPool.length}`;
            document.getElementById('current-word-target').innerText = `此題進度：${currentWord.correctCount}/${targetPerWord}`;

            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();
            document.getElementById('feedback').innerText = '';
            clearCanvas();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                submitAnswer();
            }
        }

        function submitAnswer(externalText = null) {
            if (!currentWord || locked) return;

            // 優先使用傳入的文字（手寫辨識結果），否則抓取輸入框文字
            const rawInput = externalText !== null ? externalText : document.getElementById('answer-input').value;
            const userAnswer = normalize(rawInput);
            const correctAnswer = normalize(currentWord.en);

            const feedbackEl = document.getElementById('feedback');

            if (userAnswer === correctAnswer) {
                locked = true;
                currentWord.correctCount++;
                feedbackEl.innerText = "⭕ 答對了！";
                feedbackEl.className = "text-center text-xl font-bold min-h-[2rem] mb-4 text-green-500";

                // 答對後短暫延遲自動換下一題
                setTimeout(nextQuestion, 800);
            } else {
                feedbackEl.innerText = `❌ 答錯囉！再試一次。 (辨識/輸入: ${userAnswer || '空白'})`;
                feedbackEl.className = "text-center text-xl font-bold min-h-[2rem] mb-4 text-red-500";
            }
        }

        // --- 手寫板：使用 Pointer Events（滑鼠、手指、觸控筆通用） ---

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            // 依實際顯示尺寸換算回畫布座標
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (locked) return;
            e.preventDefault();
            canvas.setPointerCapture(e.pointerId);
            isDrawing = true;

            const { x, y } = getPos(e);
            const now = performance.now();
            if (strokes.length === 0) strokeStartTime = now;
            const t = Math.round(now - strokeStartTime);

            currentStroke = [[x], [y], [t]];
            strokes.push(currentStroke);

            // 畫出起點（點一下也會留下圓點，例如 i 的點）
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + 0.01, y + 0.01);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !currentStroke) return;
            e.preventDefault();

            // 合併高頻事件，讓筆跡更細緻
            const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
            for (const ev of (events.length ? events : [e])) {
                const { x, y } = getPos(ev);
                const t = Math.round(performance.now() - strokeStartTime);
                currentStroke[0].push(x);
                currentStroke[1].push(y);
                currentStroke[2].push(t);

                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            }
        });

        function endStroke(e) {
            if (!isDrawing) return;
            isDrawing = false;
            // 只有一個點的筆畫（點一下），補第二個點避免 API 忽略
            if (currentStroke && currentStroke[0].length === 1) {
                currentStroke[0].push(currentStroke[0][0] + 0.5);
                currentStroke[1].push(currentStroke[1][0] + 0.5);
                currentStroke[2].push(currentStroke[2][0] + 10);
            }
            currentStroke = null;
            ctx.beginPath();
        }
        canvas.addEventListener('pointerup', endStroke);
        canvas.addEventListener('pointercancel', endStroke);

        // --- 筆畫辨識（Google Input Tools，非官方 API） ---

        async function postInk(contentType) {
            const body = {
                options: 'enable_pre_space',
                requests: [{
                    writing_guide: {
                        writing_area_width: canvas.width,
                        writing_area_height: canvas.height
                    },
                    ink: strokes,
                    language: 'en'
                }]
            };

            const res = await fetch(
                'https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8',
                {
                    method: 'POST',
                    headers: { 'Content-Type': contentType },
                    body: JSON.stringify(body)
                }
            );
            if (!res.ok) throw new Error('HTTP ' + res.status);

            const data = await res.json();
            if (data[0] !== 'SUCCESS') throw new Error('服務回傳 ' + data[0]);

            // data[1][0][1] 是候選字陣列，只取第一名（嚴格比對，不從候選中挑符合答案的）
            const candidates = (data[1] && data[1][0] && data[1][0][1]) || [];
            return candidates[0] || '';
        }

        async function recognizeStrokes() {
            // 先用 text/plain（屬於「簡單請求」，不會觸發 CORS 預檢），失敗再改用 application/json
            try {
                return await postInk('text/plain;charset=UTF-8');
            } catch (e1) {
                console.warn('text/plain 失敗：', e1);
                try {
                    return await postInk('application/json');
                } catch (e2) {
                    console.error('application/json 也失敗：', e2);
                    throw new Error(`${e1.message} / ${e2.message}`);
                }
            }
        }

        async function recognizeAndSubmit() {
            if (locked) return;

            const feedbackEl = document.getElementById('feedback');
            if (strokes.length === 0) {
                feedbackEl.innerText = "請先在手寫板上寫字喔！";
                feedbackEl.className = "text-center text-xl font-bold min-h-[2rem] mb-4 text-gray-500";
                return;
            }

            const btn = document.getElementById('ocr-btn');
            const btnText = document.getElementById('ocr-btn-text');
            const originalText = btnText.innerText;
            btnText.innerText = "辨識中...";
            btn.disabled = true;

            try {
                const recognized = await recognizeStrokes();

                // 填入輸入框給使用者看
                document.getElementById('answer-input').value = recognized;

                // 直接以辨識結果進行 100% 嚴格比對
                submitAnswer(recognized);
            } catch (err) {
                console.error(err);
                feedbackEl.innerText = "辨識失敗（" + err.message + "），請再試一次或改用鍵盤輸入。";
                feedbackEl.className = "text-center text-xl font-bold min-h-[2rem] mb-4 text-orange-500";
            } finally {
                btnText.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
