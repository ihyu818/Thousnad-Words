<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <title>英語千字王-11 互動測驗 (統一送出版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- 基礎設定：終極鎖死邊界，防止所有原生縮放、捲動、選取與特效 --- */
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100dvh;
            overflow: hidden; 
            background-color: #f3f4f6; font-family: sans-serif;
            
            touch-action: none;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }

        * { -webkit-user-drag: none; }

        main {
            width: 100% !important; max-width: 1200px;
            margin: 0 auto; padding: 12px;
            display: flex; height: 100dvh; max-height: 100dvh;
            transition: all 0.3s ease; box-sizing: border-box;
        }

        /* --- 共用區塊設定 --- */
        #display-area {
            background: #ffffff; border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden; display: flex; flex-direction: column;
            position: relative;
        }
        
        #control-area {
            display: flex; flex-direction: column;
        }

        /* --- 狀態 1：上下排版 (直向模式) --- */
        main.layout-col { flex-direction: column; gap: 12px; }
        main.layout-col #display-area { flex: 1.1; min-height: 0; padding: 12px; }
        main.layout-col #control-area { flex: 0.9; min-height: 0; }

        /* --- 狀態 2：左右排版 (橫向模式) --- */
        main.layout-row { flex-direction: row; align-items: stretch; gap: 24px; padding: 24px; }
        /* main.layout-row #display-area { flex: 5.5; padding: 20px; } */
        /* main.layout-row #control-area { flex: 4.5; justify-content: center; } */
        /* 調整左右比例：將左邊題目區變小 (flex: 4)，右邊手寫區變大 (flex: 6) */
        main.layout-row #display-area { flex: 4; padding: 20px; }
        main.layout-row #control-area { flex: 6; justify-content: center; }

        /* --- 手寫板設定 --- */
        #drawing-pad {
            touch-action: none; width: 100%; /* max-width: 600px;
            /* aspect-ratio: 2.2 / 1; 
            /* 移除原本的 max-width: 600px 限制，讓它可以自然撐大 */
            /* 將比例調整為更接近正方形，提供更多垂直書寫空間 */
            aspect-ratio: 1.5 / 1; 
            cursor: crosshair;
        }

        .vk-btn { touch-action: manipulation; transition: transform 0.05s, background-color 0.1s; }
        .vk-btn:active { transform: scale(0.95); }
    </style>
</head>

            option.value = i;
            option.text = `第 ${i} 關 (25字)`;
            if (i === currentLevel) option.selected = true;
            select.appendChild(option);
        }
        
        // 同步更新大標題
        document.getElementById('level-title').innerText = `英語千字王 - 第 ${currentLevel} 關`;
    }

    // 當下拉選單改變時觸發
    function changeLevel() {
        currentLevel = parseInt(document.getElementById('level-select').value);
        document.getElementById('level-title').innerText = `英語千字王 - 第 ${currentLevel} 關`;
    }

    // 網頁一載入就先產生選單
    renderLevelSelect();

    // --- 遊戲與送出邏輯 (配合選單版) ---
    function startGame() {
        targetPerWord = parseInt(document.getElementById('target-count').value) || 1;
        if (targetPerWord < 1) targetPerWord = 1;
        
        // 根據選單決定的 currentLevel 抓取對應關卡題庫
        wordPool = levelData[currentLevel].map(word => ({ ...word, correctCount: 0 }));

        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('quiz-display').classList.remove('hidden');
        
        const controls = document.getElementById('quiz-controls');
        controls.classList.remove('hidden');
        controls.classList.add('flex');

        nextQuestion();
    }

    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let strokes = [];
    let currentStroke = null;
    let strokeStartTime = 0;

    function resetCanvasStyle() {
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'black';
    }

    // 只清空畫布筆跡 (打字時觸發)
    function clearCanvasStrokes() {
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        resetCanvasStyle();
        strokes = [];
        currentStroke = null;
        isDrawing = false;
    }

    // 清空畫布與輸入框 (按下清除鈕時觸發)
    function clearAll() {
        clearCanvasStrokes();
        answerInput.value = '';
    }

    // 初始化畫布白底
    clearCanvasStrokes();

    // --- 虛擬鍵盤與實體鍵盤事件 ---
    
    // 大小寫切換
    document.getElementById('vk-shift').addEventListener('click', (e) => {
        isShift = !isShift;
        const shiftBtn = e.target;
        shiftBtn.classList.toggle('bg-blue-200', isShift);
        shiftBtn.classList.toggle('bg-gray-200', !isShift);
        
        document.querySelectorAll('.vk-key').forEach(btn => {
            const char = btn.innerText;
            if (char !== '空白' && char.length === 1 && /[a-zA-Z]/.test(char)) {
                btn.innerText = isShift ? char.toUpperCase() : char.toLowerCase();
            }
        });
    });

    // 虛擬鍵盤打字
    document.querySelectorAll('.vk-key').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (locked) return;
            clearCanvasStrokes(); // 打字時自動清空手寫筆跡
            let val = e.target.innerText;
            if (val === '空白') val = ' ';
            answerInput.value += val;
        });
    });

    // 虛擬鍵盤刪除
    document.getElementById('vk-backspace').addEventListener('click', () => {
        if (locked) return;
        clearCanvasStrokes(); // 刪除時自動清空手寫筆跡
        answerInput.value = answerInput.value.slice(0, -1);
    });

    // 支援實體鍵盤
    document.addEventListener('keydown', (e) => {
        if (document.getElementById('quiz-controls').classList.contains('hidden') || locked) return;
        
        if (e.key === 'Enter') {
            e.preventDefault();
            masterSubmit();
            return;
        }

        // 只要敲擊任何有效按鍵，就清空畫布筆跡，確立使用者「想打字」的意圖
        if (e.key === 'Backspace' || (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey)) {
            clearCanvasStrokes();
        }
        
        // 如果焦點已經在輸入框內，讓瀏覽器原生行為去處理打字即可
        if (document.activeElement === answerInput) return;

        // 如果焦點不在輸入框，手動攔截按鍵並填入
        if (e.key === 'Backspace') {
            answerInput.value = answerInput.value.slice(0, -1);
        } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
            answerInput.value += e.key;
        }
    });

    // --- 手寫板事件與 API 辨識 ---
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (canvas.width / rect.width),
            y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    canvas.addEventListener('pointerdown', (e) => {
        if (locked) return;
        e.preventDefault();
        
        // 雙向防呆：當筆尖落下時，如果畫布是空的但輸入框有字，清空輸入框，確立使用者「想手寫」的意圖
        if (strokes.length === 0 && answerInput.value.length > 0) {
            answerInput.value = '';
        }

        canvas.setPointerCapture(e.pointerId);
        isDrawing = true;

        const { x, y } = getPos(e);
        const now = performance.now();
        if (strokes.length === 0) strokeStartTime = now;
        const t = Math.round(now - strokeStartTime);

        currentStroke = [[x], [y], [t]];
        strokes.push(currentStroke);

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 0.01, y + 0.01);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!isDrawing || !currentStroke) return;
        e.preventDefault();

        const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const ev of (events.length ? events : [e])) {
            const { x, y } = getPos(ev);
            const t = Math.round(performance.now() - strokeStartTime);
            currentStroke[0].push(x);
            currentStroke[1].push(y);
            currentStroke[2].push(t);

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }
    });

    function endStroke(e) {
        if (!isDrawing) return;
        isDrawing = false;
        if (currentStroke && currentStroke[0].length === 1) {
            currentStroke[0].push(currentStroke[0][0] + 0.5);
            currentStroke[1].push(currentStroke[1][0] + 0.5);
            currentStroke[2].push(currentStroke[2][0] + 10);
        }
        currentStroke = null;
        ctx.beginPath();
    }
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);

    // --- 遊戲與送出邏輯 ---
    function startGame() {
        targetPerWord = parseInt(document.getElementById('target-count').value) || 1;
        if (targetPerWord < 1) targetPerWord = 1;
        wordPool = rawVocab.map(word => ({ ...word, correctCount: 0 }));

        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('quiz-display').classList.remove('hidden');
        
        const controls = document.getElementById('quiz-controls');
        controls.classList.remove('hidden');
        controls.classList.add('flex');

        nextQuestion();
    }

    function nextQuestion() {
        locked = false;
        wordPool = wordPool.filter(w => w.correctCount < targetPerWord);

        if (wordPool.length === 0) {
            document.getElementById('quiz-display').classList.add('hidden');
            document.getElementById('quiz-controls').classList.add('hidden');
            document.getElementById('quiz-controls').classList.remove('flex');
            document.getElementById('finish-section').classList.remove('hidden');
            return;
        }

        const randomIndex = Math.floor(Math.random() * wordPool.length);
        currentWord = wordPool[randomIndex];

        document.getElementById('question-text').innerText = currentWord.zh;
        document.getElementById('progress-text').innerText = `剩餘：${wordPool.length}`;
        document.getElementById('current-word-target').innerText = `進度：${currentWord.correctCount}/${targetPerWord}`;

        document.getElementById('feedback').innerText = '';
        clearAll(); // 自動清空上一題的殘留
    }

    async function postInk(contentType) {
        const body = {
            options: 'enable_pre_space',
            requests: [{
                writing_guide: { writing_area_width: canvas.width, writing_area_height: canvas.height },
                ink: strokes,
                language: 'en'
            }]
        };
        const res = await fetch('https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8', {
            method: 'POST',
            headers: { 'Content-Type': contentType },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data[0] !== 'SUCCESS') throw new Error('服務回傳 ' + data[0]);
        const candidates = (data[1] && data[1][0] && data[1][0][1]) || [];
        return candidates[0] || '';
    }

    async function recognizeStrokes() {
        try { return await postInk('text/plain;charset=UTF-8'); } 
        catch (e1) {
            try { return await postInk('application/json'); } 
            catch (e2) { throw new Error(`${e1.message} / ${e2.message}`); }
        }
    }

    // 統一送出中樞
    async function masterSubmit() {
        if (locked) return;
        const feedbackEl = document.getElementById('feedback');

        // 情境 1：使用者有手寫筆跡，執行辨識並送出
        if (strokes.length > 0) {
            const btn = document.getElementById('master-submit-btn');
            const originalText = btn.innerText;
            btn.innerText = "辨識中...";
            btn.disabled = true;

            try {
                const recognized = await recognizeStrokes();
                answerInput.value = recognized; // 辨識結果填入輸入框
                submitAnswer(recognized);
            } catch (err) {
                console.error(err);
                feedbackEl.innerText = "辨識失敗，請再試一次或改用鍵盤。";
                feedbackEl.className = "text-center text-xl md:text-2xl font-bold h-[2.5rem] flex items-center justify-center mb-2 text-orange-500";
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        } 
        // 情境 2：沒有筆跡，直接送出輸入框內的值 (鍵盤打字)
        else {
            if (answerInput.value.trim() === '') {
                feedbackEl.innerText = "請先打字或手寫喔！";
                feedbackEl.className = "text-center text-xl md:text-2xl font-bold h-[2.5rem] flex items-center justify-center mb-2 text-gray-500";
                return;
            }
            submitAnswer(answerInput.value);
        }
    }

    function submitAnswer(rawInput) {
        if (!currentWord || locked) return;

        const userAnswer = normalize(rawInput);
        const correctAnswer = normalize(currentWord.en);
        const feedbackEl = document.getElementById('feedback');

        if (userAnswer === correctAnswer) {
            locked = true;
            currentWord.correctCount++;
            feedbackEl.innerText = "⭕ 答對了！";
            feedbackEl.className = "text-center text-xl md:text-2xl font-bold h-[2.5rem] flex items-center justify-center mb-2 text-green-500";
            setTimeout(nextQuestion, 800);
        } else {
            feedbackEl.innerText = `❌ 答錯囉！ (輸入: ${userAnswer || '空白'})`;
            feedbackEl.className = "text-center text-xl md:text-2xl font-bold h-[2.5rem] flex items-center justify-center mb-2 text-red-500";
            clearAll(); // 答錯全數清空方便重來
        }
    }
</script>
</body>
