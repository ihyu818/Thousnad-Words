<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>英語千字王-11 互動測驗 (雙區塊版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- 基礎設定：終極鎖死邊界，防止所有原生縮放、捲動、選取與特效 --- */
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100dvh;
            overflow: hidden; 
            background-color: #f3f4f6; font-family: sans-serif;
            
            /* 1. 封印雙指縮放、原生滑動 */
            touch-action: none;
            /* 2. 封印長按選取文字 */
            -webkit-user-select: none;
            user-select: none;
            /* 3. 封印長按彈出系統選單 (拷貝/查詢) */
            -webkit-touch-callout: none;
            /* 4. 封印畫面邊緣的橡皮筋回彈滑動 */
            overscroll-behavior: none;
            /* 5. 封印點擊按鈕時系統自帶的灰色半透明閃爍 */
            -webkit-tap-highlight-color: transparent;
        }

        /* 6. 封印所有圖片或元素的意外拖曳 */
        * {
            -webkit-user-drag: none;
        }

        main {
            width: 100% !important; max-width: 1200px;
            margin: 0 auto; padding: 12px;
            display: flex; height: 100dvh; max-height: 100dvh;
            transition: all 0.3s ease; box-sizing: border-box;
        }

        /* --- 共用區塊設定 --- */
        #display-area {
            background: #ffffff; border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden; display: flex; flex-direction: column;
            position: relative; /* 讓內部覆蓋層可絕對定位 */
        }
        
        #control-area {
            display: flex; flex-direction: column;
        }

        /* --- 狀態 1：上下排版 (直向模式) --- */
        main.layout-col { flex-direction: column; gap: 16px; }
        main.layout-col #display-area { flex: 1; min-height: 0; }
        main.layout-col #control-area { flex: 0 0 auto; }

        /* --- 狀態 2：左右排版 (橫向模式) --- */
        main.layout-row { flex-direction: row; align-items: stretch; gap: 24px; padding: 24px; }
        main.layout-row #display-area { flex: 6; }
        main.layout-row #control-area { flex: 4; justify-content: center; }

        /* --- 手寫板設定 --- */
        #drawing-pad {
            touch-action: none;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 2 / 1; /* 強制維持比例，配合內部 600x300 解析度 */
            cursor: crosshair;
        }
    </style>
</head>
<body>

<main id="app-main" class="layout-col">
    
    <!-- 區塊一：展示區 (顯示題目、回饋、設定) -->
    <div id="display-area" class="items-center justify-center p-4">
        
        <!-- 設定畫面 (覆蓋在最上層) -->
        <div id="setup-section" class="absolute inset-0 bg-white z-10 flex flex-col items-center justify-center text-center p-6">
            <h1 class="text-3xl font-bold text-blue-600 mb-6">英語千字王 - 第十一關</h1>
            <h2 class="text-xl mb-4 font-semibold text-gray-700">測驗設定</h2>
            <div class="mb-8">
                <label for="target-count" class="mr-2 text-gray-600">每個單字需要答對次數：</label>
                <input type="number" id="target-count" value="1" min="1" max="10" class="border-2 border-blue-300 rounded px-3 py-1 w-20 text-center text-lg focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="startGame()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-md text-lg transition duration-200">
                開始測驗
            </button>
        </div>

        <!-- 測驗題目展示 -->
        <div id="quiz-display" class="hidden w-full h-full flex flex-col justify-center items-center">
            <div class="absolute top-4 left-0 w-full px-6 flex justify-between text-sm text-gray-400 font-medium">
                <span id="progress-text">剩餘單字：25</span>
                <span id="current-word-target">目標次數：0/1</span>
            </div>

            <div class="text-center mt-6">
                <p class="text-gray-500 mb-3 text-lg">請拼出以下中文的英文單字：</p>
                <h2 id="question-text" class="text-5xl md:text-6xl font-extrabold text-gray-800 tracking-wider mb-8">中文</h2>
            </div>

            <div id="feedback" class="text-center text-2xl font-bold min-h-[3rem]"></div>
        </div>

        <!-- 完成畫面 (覆蓋在最上層) -->
        <div id="finish-section" class="hidden absolute inset-0 bg-white z-10 flex flex-col items-center justify-center text-center p-6">
            <h2 class="text-5xl font-bold text-green-500 mb-6">🎉 恭喜過關！</h2>
            <p class="text-xl mb-8 text-gray-600">你已經成功將所有單字練習完畢！</p>
            <button onclick="location.reload()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-md text-lg transition duration-200">
                重新測驗
            </button>
        </div>
    </div>

    <!-- 區塊二：控制區 (工具列、鍵盤輸入、手寫板) -->
    <div id="control-area">
        <!-- 頂部工具列 -->
        <div class="flex justify-end mb-3 flex-shrink-0">
            <button id="layout-toggle" class="bg-gray-800 text-white px-3 py-1.5 rounded-lg shadow text-sm opacity-80 hover:opacity-100 transition flex items-center gap-1">
                <span>🔄</span> 切換版面
            </button>
        </div>

        <!-- 輸入控制面板 (遊戲開始後才顯示) -->
        <div id="quiz-controls" class="hidden flex-col gap-3 flex-1 justify-center">
            
            <!-- 鍵盤輸入區 -->
            <div class="flex justify-center w-full px-2">
                <input type="text" id="answer-input" placeholder="點此打字..." autocomplete="off" autocapitalize="off" spellcheck="false" class="border-2 border-gray-300 border-b-4 border-b-blue-400 rounded-lg bg-gray-50 text-center text-2xl py-3 px-4 w-full focus:outline-none focus:border-b-blue-600 transition shadow-sm" onkeypress="handleKeyPress(event)">
                <button onclick="submitAnswer()" class="ml-3 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-lg shadow transition duration-200 whitespace-nowrap text-lg">
                    送出
                </button>
            </div>

            <div class="relative flex items-center py-2">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink-0 mx-4 text-gray-400 text-sm font-bold">或</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>

            <!-- 手寫板區域 -->
            <div class="flex flex-col items-center px-2">
                <p class="text-sm text-gray-500 mb-2 font-medium">在下方手寫板寫出完整小寫單字</p>
                <!-- 內部解析度維持 600x300，由 CSS 控制實際顯示大小 -->
                <canvas id="drawing-pad" width="600" height="300" class="border-2 border-gray-300 rounded-xl bg-white shadow-sm"></canvas>
                
                <div class="flex justify-center gap-3 mt-4 w-full">
                    <button onclick="clearCanvas()" class="flex-1 max-w-[140px] bg-gray-400 hover:bg-gray-500 text-white py-3 px-4 rounded-xl shadow transition duration-200 font-bold">清除重寫</button>
                    <button id="ocr-btn" onclick="recognizeAndSubmit()" class="flex-[2] max-w-[240px] bg-indigo-500 hover:bg-indigo-600 disabled:opacity-60 text-white py-3 px-4 rounded-xl shadow transition duration-200 font-bold flex justify-center items-center">
                        <span id="ocr-btn-text">辨識並送出解答</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    // --- 版面切換邏輯 ---
    const mainEl = document.getElementById('app-main');
    const toggleBtn = document.getElementById('layout-toggle');

    function initLayout() {
        if (window.innerWidth > window.innerHeight && window.innerWidth >= 768) {
            mainEl.className = 'layout-row';
        } else {
            mainEl.className = 'layout-col';
        }
    }
    initLayout();

    toggleBtn.addEventListener('click', () => {
        if (mainEl.classList.contains('layout-row')) {
            mainEl.className = 'layout-col';
        } else {
            mainEl.className = 'layout-row';
        }
        window.dispatchEvent(new Event('resize'));
    });

    // --- 遊戲資料與變數 ---
    const rawVocab = [
        { en: "one", zh: "一/一個" }, { en: "open", zh: "打開" }, { en: "or", zh: "或者" },
        { en: "orange", zh: "柳丁" }, { en: "out", zh: "出去" }, { en: "outside", zh: "外面" },
        { en: "over", zh: "在..之上;結束" }, { en: "pants", zh: "褲子" }, { en: "paper", zh: "紙" },
        { en: "park", zh: "公園" }, { en: "party", zh: "宴會" }, { en: "pass", zh: "通過;經過" },
        { en: "PE", zh: "體育課" }, { en: "pen", zh: "筆" }, { en: "pencil", zh: "鉛筆" },
        { en: "pet", zh: "寵物" }, { en: "piano", zh: "鋼琴" }, { en: "pick", zh: "撿拾" },
        { en: "pie", zh: "派" }, { en: "pig", zh: "豬" }, { en: "pink", zh: "粉紅色" },
        { en: "pizza", zh: "披薩" }, { en: "play", zh: "玩" }, { en: "p.m.", zh: "午後" },
        { en: "poor", zh: "貧窮的;可憐的" }
    ];

    let wordPool = [];
    let currentWord = null;
    let targetPerWord = 1;
    let locked = false;

    function normalize(s) {
        return String(s).toLowerCase().replace(/[^a-z]/g, '');
    }

    // --- 手寫板相關變數 ---
    const canvas = document.getElementById('drawing-pad');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let strokes = [];
    let currentStroke = null;
    let strokeStartTime = 0;

    function resetCanvasStyle() {
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'black';
    }

    function clearCanvas() {
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        resetCanvasStyle();
        strokes = [];
        currentStroke = null;
        isDrawing = false;
    }
    clearCanvas();

    // --- 遊戲邏輯 ---
    function startGame() {
        targetPerWord = parseInt(document.getElementById('target-count').value) || 1;
        if (targetPerWord < 1) targetPerWord = 1;

        wordPool = rawVocab.map(word => ({ ...word, correctCount: 0 }));

        // 切換顯示區塊
        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('quiz-display').classList.remove('hidden');
        
        // 顯示控制區並設定 Flex
        const controls = document.getElementById('quiz-controls');
        controls.classList.remove('hidden');
        controls.classList.add('flex');

        nextQuestion();
    }

    function nextQuestion() {
        locked = false;
        wordPool = wordPool.filter(w => w.correctCount < targetPerWord);

        if (wordPool.length === 0) {
            document.getElementById('quiz-display').classList.add('hidden');
            document.getElementById('quiz-controls').classList.add('hidden');
            document.getElementById('quiz-controls').classList.remove('flex');
            document.getElementById('finish-section').classList.remove('hidden');
            return;
        }

        const randomIndex = Math.floor(Math.random() * wordPool.length);
        currentWord = wordPool[randomIndex];

        document.getElementById('question-text').innerText = currentWord.zh;
        document.getElementById('progress-text').innerText = `剩餘單字：${wordPool.length}`;
        document.getElementById('current-word-target').innerText = `此題進度：${currentWord.correctCount}/${targetPerWord}`;

        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').focus();
        document.getElementById('feedback').innerText = '';
        clearCanvas();
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') submitAnswer();
    }

    function submitAnswer(externalText = null) {
        if (!currentWord || locked) return;

        const rawInput = externalText !== null ? externalText : document.getElementById('answer-input').value;
        const userAnswer = normalize(rawInput);
        const correctAnswer = normalize(currentWord.en);
        const feedbackEl = document.getElementById('feedback');

        if (userAnswer === correctAnswer) {
            locked = true;
            currentWord.correctCount++;
            feedbackEl.innerText = "⭕ 答對了！";
            feedbackEl.className = "text-center text-2xl font-bold min-h-[3rem] text-green-500";
            setTimeout(nextQuestion, 800);
        } else {
            feedbackEl.innerText = `❌ 答錯囉！ (辨識/輸入: ${userAnswer || '空白'})`;
            feedbackEl.className = "text-center text-2xl font-bold min-h-[3rem] text-red-500";
        }
    }

    // --- 手寫板事件與 API 辨識 ---
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (canvas.width / rect.width),
            y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    canvas.addEventListener('pointerdown', (e) => {
        if (locked) return;
        e.preventDefault();
        canvas.setPointerCapture(e.pointerId);
        isDrawing = true;

        const { x, y } = getPos(e);
        const now = performance.now();
        if (strokes.length === 0) strokeStartTime = now;
        const t = Math.round(now - strokeStartTime);

        currentStroke = [[x], [y], [t]];
        strokes.push(currentStroke);

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 0.01, y + 0.01);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!isDrawing || !currentStroke) return;
        e.preventDefault();

        const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const ev of (events.length ? events : [e])) {
            const { x, y } = getPos(ev);
            const t = Math.round(performance.now() - strokeStartTime);
            currentStroke[0].push(x);
            currentStroke[1].push(y);
            currentStroke[2].push(t);

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }
    });

    function endStroke(e) {
        if (!isDrawing) return;
        isDrawing = false;
        if (currentStroke && currentStroke[0].length === 1) {
            currentStroke[0].push(currentStroke[0][0] + 0.5);
            currentStroke[1].push(currentStroke[1][0] + 0.5);
            currentStroke[2].push(currentStroke[2][0] + 10);
        }
        currentStroke = null;
        ctx.beginPath();
    }
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);

    async function postInk(contentType) {
        const body = {
            options: 'enable_pre_space',
            requests: [{
                writing_guide: { writing_area_width: canvas.width, writing_area_height: canvas.height },
                ink: strokes,
                language: 'en'
            }]
        };

        const res = await fetch('https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8', {
            method: 'POST',
            headers: { 'Content-Type': contentType },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const data = await res.json();
        if (data[0] !== 'SUCCESS') throw new Error('服務回傳 ' + data[0]);

        const candidates = (data[1] && data[1][0] && data[1][0][1]) || [];
        return candidates[0] || '';
    }

    async function recognizeStrokes() {
        try {
            return await postInk('text/plain;charset=UTF-8');
        } catch (e1) {
            try {
                return await postInk('application/json');
            } catch (e2) {
                throw new Error(`${e1.message} / ${e2.message}`);
            }
        }
    }

    async function recognizeAndSubmit() {
        if (locked) return;
        const feedbackEl = document.getElementById('feedback');
        if (strokes.length === 0) {
            feedbackEl.innerText = "請先在手寫板上寫字喔！";
            feedbackEl.className = "text-center text-2xl font-bold min-h-[3rem] text-gray-500";
            return;
        }

        const btn = document.getElementById('ocr-btn');
        const btnText = document.getElementById('ocr-btn-text');
        const originalText = btnText.innerText;
        btnText.innerText = "辨識中...";
        btn.disabled = true;

        try {
            const recognized = await recognizeStrokes();
            document.getElementById('answer-input').value = recognized;
            submitAnswer(recognized);
        } catch (err) {
            console.error(err);
            feedbackEl.innerText = "辨識失敗，請再試一次或改用鍵盤。";
            feedbackEl.className = "text-center text-2xl font-bold min-h-[3rem] text-orange-500";
        } finally {
            btnText.innerText = originalText;
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
