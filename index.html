<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title> 英語千字王闖關練習 </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- 基礎設定：終極鎖死邊界，防止所有原生縮放、捲動、選取與特效 --- */
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100dvh;
            overflow: hidden; 
            background-color: #f3f4f6; font-family: sans-serif;
            
            touch-action: none;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }

        * { -webkit-user-drag: none; }

        main {
            width: 100% !important; max-width: 1200px;
            margin: 0 auto; padding: 12px;
            display: flex; height: 100dvh; max-height: 100dvh;
            transition: all 0.3s ease; box-sizing: border-box;
        }

        /* --- 共用區塊設定 --- */
        #display-area {
            background: #ffffff; border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden; display: flex; flex-direction: column;
            position: relative;
        }
        
        #control-area {
            display: flex; flex-direction: column;
        }

        /* --- 狀態 1：上下排版 (直向模式) --- */
        main.layout-col { flex-direction: column; gap: 12px; }
        main.layout-col #display-area { flex: 1.1; min-height: 0; padding: 12px; }
        main.layout-col #control-area { flex: 0.9; min-height: 0; }

        /* --- 狀態 2：左右排版 (橫向模式) --- */
        main.layout-row { flex-direction: row; align-items: stretch; gap: 24px; padding: 24px; }
        /* main.layout-row #display-area { flex: 5.5; padding: 20px; } */
        /* main.layout-row #control-area { flex: 4.5; justify-content: center; } */
        /* 調整左右比例：將左邊題目區變小 (flex: 4)，右邊手寫區變大 (flex: 6) */
        main.layout-row #display-area { flex: 4; padding: 20px; }
        main.layout-row #control-area { flex: 6; justify-content: center; }

        /* --- 手寫板設定 --- */
        #drawing-pad {
            touch-action: none; width: 100%; /* max-width: 600px;
            /* aspect-ratio: 2.2 / 1; 
            /* 移除原本的 max-width: 600px 限制，讓它可以自然撐大 */
            /* 將比例調整為更接近正方形，提供更多垂直書寫空間 */
            aspect-ratio: 1.5 / 1; 
            cursor: crosshair;
        }

        .vk-btn { touch-action: manipulation; transition: transform 0.05s, background-color 0.1s; }
        .vk-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<main id="app-main" class="layout-col">
    
    <!-- 區塊一：展示區 -->
    <div id="display-area" class="justify-center">
        
        <!-- 設定畫面 -->
        <div id="setup-section" class="absolute inset-0 bg-white z-20 flex flex-col items-center justify-center text-center p-6">
            <h1 class="text-3xl font-bold text-blue-600 mb-6">英語千字王 - 第十二關</h1>
            <h2 class="text-xl mb-4 font-semibold text-gray-700">測驗設定</h2>
            <div class="mb-8">
                <label for="target-count" class="mr-2 text-gray-600">每個單字需要答對次數：</label>
                <input type="number" id="target-count" value="1" min="1" max="10" class="border-2 border-blue-300 rounded px-3 py-1 w-20 text-center text-lg focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="startGame()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-md text-lg transition duration-200">
                開始測驗
            </button>
        </div>

        <!-- 測驗內容展示區 -->
        <div id="quiz-display" class="hidden w-full h-full flex flex-col justify-between">
            <div class="w-full flex justify-between text-sm text-gray-400 font-medium px-2 pt-2">
                <span id="progress-text">剩餘單字：25</span>
                <span id="current-word-target">進度：0/1</span>
            </div>

            <!-- 題目區 -->
            <div class="text-center mt-2 mb-4 flex-shrink-0">
                <h2 id="question-text" class="text-4xl md:text-5xl font-extrabold text-gray-800 tracking-wider">中文</h2>
            </div>

            <!-- 虛擬鍵盤 -->
            <div id="virtual-keyboard" class="w-full max-w-lg mx-auto flex flex-col gap-1.5 md:gap-2 px-1 pb-2">
                <div class="flex justify-center gap-1 md:gap-1.5">
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">q</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">w</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">e</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">r</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">t</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">y</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">u</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">i</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">o</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">p</button>
                </div>
                <div class="flex justify-center gap-1 md:gap-1.5 px-3 md:px-5">
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">a</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">s</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">d</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">f</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">g</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">h</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">j</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">k</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">l</button>
                </div>
                <div class="flex justify-center gap-1 md:gap-1.5">
                    <button id="vk-shift" class="vk-btn bg-gray-200 hover:bg-gray-300 active:bg-blue-300 text-gray-800 font-bold py-2.5 rounded shadow border border-gray-300 flex-[1.5] text-lg">⇧</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">z</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">x</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">c</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">v</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">b</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">n</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-lg">m</button>
                    <button id="vk-backspace" class="vk-btn bg-gray-200 hover:bg-gray-300 active:bg-red-300 text-gray-800 font-bold py-2.5 rounded shadow border border-gray-300 flex-[1.5] text-lg">⌫</button>
                </div>
                <div class="flex justify-center gap-1 md:gap-1.5 px-2 md:px-8">
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-xl">,</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-xl">.</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-[3] text-lg">空白</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-xl">'</button>
                    <button class="vk-btn vk-key bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded shadow border border-gray-200 flex-1 text-xl">-</button>
                </div>
            </div>

            <!-- 回饋文字 -->
            <div id="feedback" class="text-center text-xl md:text-2xl font-bold h-[2.5rem] flex items-center justify-center mb-2"></div>
        </div>

        <!-- 完成畫面 -->
        <div id="finish-section" class="hidden absolute inset-0 bg-white z-20 flex flex-col items-center justify-center text-center p-6">
            <h2 class="text-5xl font-bold text-green-500 mb-6">🎉 恭喜過關！</h2>
            <p class="text-xl mb-8 text-gray-600">你已經成功將所有單字練習完畢！</p>
            <button onclick="location.reload()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-md text-lg transition duration-200">
                重新測驗
            </button>
        </div>
    </div>

    <!-- 區塊二：控制區 (輸入顯示、手寫板、統一按鈕) -->
    <div id="control-area">
        <div class="flex justify-end mb-2 flex-shrink-0 px-2">
            <button id="layout-toggle" class="bg-gray-800 text-white px-3 py-1.5 rounded-lg shadow text-sm opacity-80 hover:opacity-100 transition flex items-center gap-1">
                <span>🔄</span> 切換版面
            </button>
        </div>

        <div id="quiz-controls" class="hidden flex-col gap-2 flex-1 justify-center">
            
            <!-- 答案顯示區 (使用 inputmode="none" 防虛擬鍵盤，但保留實體鍵盤與游標支援) -->
            <div class="flex justify-center w-full px-2">
                <input type="text" id="answer-input" inputmode="none" placeholder="可打字或手寫..." class="border-2 border-gray-300 border-b-4 border-b-blue-400 rounded-lg bg-gray-50 text-center text-2xl py-3 px-4 w-full max-w-[600px] focus:outline-none focus:border-b-blue-600 transition shadow-inner text-gray-800 font-mono tracking-wide">
            </div>

            <!-- 手寫板區域 -->
            <div class="flex flex-col items-center px-2 mt-1">
                <canvas id="drawing-pad" width="600" height="272" class="border-2 border-gray-300 rounded-xl bg-white shadow-sm"></canvas>
                
                <!-- 統一按鈕區 -->
                <div class="flex justify-center gap-3 mt-4 w-full max-w-[600px]">
                    <button onclick="clearAll()" class="flex-1 bg-gray-400 hover:bg-gray-500 text-white py-3 px-4 rounded-xl shadow transition duration-200 font-bold text-lg tracking-wide">清除</button>
                    <button id="master-submit-btn" onclick="masterSubmit()" class="flex-[2] bg-green-500 hover:bg-green-600 disabled:opacity-60 text-white py-3 px-4 rounded-xl shadow transition duration-200 font-bold flex justify-center items-center text-lg tracking-wide">
                        確認送出
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    // --- 版面切換邏輯 ---
    const mainEl = document.getElementById('app-main');
    const toggleBtn = document.getElementById('layout-toggle');

    function initLayout() {
        if (window.innerWidth > window.innerHeight && window.innerWidth >= 768) {
            mainEl.className = 'layout-row';
        } else {
            mainEl.className = 'layout-col';
        }
    }
    initLayout();

    toggleBtn.addEventListener('click', () => {
        mainEl.className = mainEl.classList.contains('layout-row') ? 'layout-col' : 'layout-row';
        window.dispatchEvent(new Event('resize'));
    });

    // --- 遊戲資料與變數 ---
    //  const rawVocab = [
    //     { en: "one", zh: "一/一個" }, { en: "open", zh: "打開" }, { en: "or", zh: "或者" },
    //     { en: "orange", zh: "柳丁" }, { en: "out", zh: "出去" }, { en: "outside", zh: "外面" },
    //     { en: "over", zh: "在..之上;結束" }, { en: "pants", zh: "褲子" }, { en: "paper", zh: "紙" },
    //     { en: "park", zh: "公園" }, { en: "party", zh: "宴會" }, { en: "pass", zh: "通過;經過" },
    //     { en: "PE", zh: "體育課" }, { en: "pen", zh: "筆" }, { en: "pencil", zh: "鉛筆" },
    //     { en: "pet", zh: "寵物" }, { en: "piano", zh: "鋼琴" }, { en: "pick", zh: "撿拾" },
    //     { en: "pie", zh: "派" }, { en: "pig", zh: "豬" }, { en: "pink", zh: "粉紅色" },
    //     { en: "pizza", zh: "披薩" }, { en: "play", zh: "玩" }, { en: "p.m.", zh: "午後" },
    //     { en: "poor", zh: "貧窮的;可憐的" }
    // ];

    const rawVocab = [
        { en: "pork", zh: "豬肉" }, { en: "pretty", zh: "漂亮的" }, { en: "purple", zh: "紫色的" },
        { en: "queen", zh: "皇后" }, { en: "rabbit", zh: "兔子" }, { en: "race", zh: "競賽" },
        { en: "radio", zh: "收音機" }, { en: "rain", zh: "雨" }, { en: "rainy", zh: "下雨的" },
        { en: "ready", zh: "準備好的" }, { en: "red", zh: "紅色" }, { en: "rice", zh: "米" },
        { en: "rich", zh: "富有的" }, { en: "ring", zh: "戒指" }, { en: "river", zh: "河流" },
        { en: "road", zh: "道路" }, { en: "R.O.C.", zh: "中華民國" }, { en: "rock", zh: "岩石" },
        { en: "room", zh: "房間" }, { en: "rose", zh: "玫瑰" }, { en: "ruler", zh: "尺" },
        { en: "run", zh: "跑步" }, { en: "sad", zh: "悲傷" }, { en: "safe", zh: "安全" },
        { en: "salad", zh: "沙拉" }
    ];

    let wordPool = [];
    let currentWord = null;
    let targetPerWord = 1;
    let locked = false;
    let isShift = false;
    const answerInput = document.getElementById('answer-input');

    function normalize(s) {
        return String(s).toLowerCase().replace(/[^a-z.\-']/g, '');
    }

    // --- 畫布清除邏輯 ---
    const canvas = document.getElementById('drawing-pad');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let strokes = [];
    let currentStroke = null;
    let strokeStartTime = 0;

    function resetCanvasStyle() {
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'black';
    }

    // 只清空畫布筆跡 (打字時觸發)
    function clearCanvasStrokes() {
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        resetCanvasStyle();
        strokes = [];
        currentStroke = null;
        isDrawing = false;
    }

    // 清空畫布與輸入框 (按下清除鈕時觸發)
    function clearAll() {
        clearCanvasStrokes();
        answerInput.value = '';
    }

    // 初始化畫布白底
    clearCanvasStrokes();

    // --- 虛擬鍵盤與實體鍵盤事件 ---
    
    // 大小寫切換
    document.getElementById('vk-shift').addEventListener('click', (e) => {
        isShift = !isShift;
        const shiftBtn = e.target;
        shiftBtn.classList.toggle('bg-blue-200', isShift);
        shiftBtn.classList.toggle('bg-gray-200', !isShift);
        
        document.querySelectorAll('.vk-key').forEach(btn => {
            const char = btn.innerText;
            if (char !== '空白' && char.length === 1 && /[a-zA-Z]/.test(char)) {
                btn.innerText = isShift ? char.toUpperCase() : char.toLowerCase();
            }
        });
    });

    // 虛擬鍵盤打字
    document.querySelectorAll('.vk-key').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (locked) return;
            clearCanvasStrokes(); // 打字時自動清空手寫筆跡
            let val = e.target.innerText;
            if (val === '空白') val = ' ';
            answerInput.value += val;
        });
    });

    // 虛擬鍵盤刪除
    document.getElementById('vk-backspace').addEventListener('click', () => {
        if (locked) return;
        clearCanvasStrokes(); // 刪除時自動清空手寫筆跡
        answerInput.value = answerInput.value.slice(0, -1);
    });

    // 支援實體鍵盤
    document.addEventListener('keydown', (e) => {
        if (document.getElementById('quiz-controls').classList.contains('hidden') || locked) return;
        
        if (e.key === 'Enter') {
            e.preventDefault();
            masterSubmit();
            return;
        }

        // 只要敲擊任何有效按鍵，就清空畫布筆跡，確立使用者「想打字」的意圖
        if (e.key === 'Backspace' || (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey)) {
            clearCanvasStrokes();
        }
        
        // 如果焦點已經在輸入框內，讓瀏覽器原生行為去處理打字即可
        if (document.activeElement === answerInput) return;

        // 如果焦點不在輸入框，手動攔截按鍵並填入
        if (e.key === 'Backspace') {
            answerInput.value = answerInput.value.slice(0, -1);
        } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
            answerInput.value += e.key;
        }
    });

    // --- 手寫板事件與 API 辨識 ---
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (canvas.width / rect.width),
            y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    canvas.addEventListener('pointerdown', (e) => {
        if (locked) return;
        e.preventDefault();
        
        // 雙向防呆：當筆尖落下時，如果畫布是空的但輸入框有字，清空輸入框，確立使用者「想手寫」的意圖
        if (strokes.length === 0 && answerInput.value.length > 0) {
            answerInput.value = '';
        }

        canvas.setPointerCapture(e.pointerId);
        isDrawing = true;

        const { x, y } = getPos(e);
        const now = performance.now();
        if (strokes.length === 0) strokeStartTime = now;
        const t = Math.round(now - strokeStartTime);

        currentStroke = [[x], [y], [t]];
        strokes.push(currentStroke);

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 0.01, y + 0.01);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!isDrawing || !currentStroke) return;
        e.preventDefault();

        const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const ev of (events.length ? events : [e])) {
            const { x, y } = getPos(ev);
            const t = Math.round(performance.now() - strokeStartTime);
            currentStroke[0].push(x);
            currentStroke[1].push(y);
            currentStroke[2].push(t);

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }
    });

    function endStroke(e) {
        if (!isDrawing) return;
        isDrawing = false;
        if (currentStroke && currentStroke[0].length === 1) {
            currentStroke[0].push(currentStroke[0][0] + 0.5);
            currentStroke[1].push(currentStroke[1][0] + 0.5);
            currentStroke[2].push(currentStroke[2][0] + 10);
        }
        currentStroke = null;
        ctx.beginPath();
    }
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);

    // --- 遊戲與送出邏輯 ---
    function startGame() {
        targetPerWord = parseInt(document.getElementById('target-count').value) || 1;
        if (targetPerWord < 1) targetPerWord = 1;
        wordPool = rawVocab.map(word => ({ ...word, correctCount: 0 }));

        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('quiz-display').classList.remove('hidden');
        
        const controls = document.getElementById('quiz-controls');
        controls.classList.remove('hidden');
        controls.classList.add('flex');

        nextQuestion();
    }

    function nextQuestion() {
        locked = false;
        wordPool = wordPool.filter(w => w.correctCount < targetPerWord);

        if (wordPool.length === 0) {
            document.getElementById('quiz-display').classList.add('hidden');
            document.getElementById('quiz-controls').classList.add('hidden');
            document.getElementById('quiz-controls').classList.remove('flex');
            document.getElementById('finish-section').classList.remove('hidden');
            return;
        }

        const randomIndex = Math.floor(Math.random() * wordPool.length);
        currentWord = wordPool[randomIndex];

        document.getElementById('question-text').innerText = currentWord.zh;
        document.getElementById('progress-text').innerText = `剩餘：${wordPool.length}`;
        document.getElementById('current-word-target').innerText = `進度：${currentWord.correctCount}/${targetPerWord}`;

        document.getElementById('feedback').innerText = '';
        clearAll(); // 自動清空上一題的殘留
    }

    async function postInk(contentType) {
        const body = {
            options: 'enable_pre_space',
            requests: [{
                writing_guide: { writing_area_width: canvas.width, writing_area_height: canvas.height },
                ink: strokes,
                language: 'en'
            }]
        };
        const res = await fetch('https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8', {
            method: 'POST',
            headers: { 'Content-Type': contentType },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data[0] !== 'SUCCESS') throw new Error('服務回傳 ' + data[0]);
        const candidates = (data[1] && data[1][0] && data[1][0][1]) || [];
        return candidates[0] || '';
    }

    async function recognizeStrokes() {
        try { return await postInk('text/plain;charset=UTF-8'); } 
        catch (e1) {
            try { return await postInk('application/json'); } 
            catch (e2) { throw new Error(`${e1.message} / ${e2.message}`); }
        }
    }

    // 統一送出中樞
    async function masterSubmit() {
        if (locked) return;
        const feedbackEl = document.getElementById('feedback');

        // 情境 1：使用者有手寫筆跡，執行辨識並送出
        if (strokes.length > 0) {
            const btn = document.getElementById('master-submit-btn');
            const originalText = btn.innerText;
            btn.innerText = "辨識中...";
            btn.disabled = true;

            try {
                const recognized = await recognizeStrokes();
                answerInput.value = recognized; // 辨識結果填入輸入框
                submitAnswer(recognized);
            } catch (err) {
                console.error(err);
                feedbackEl.innerText = "辨識失敗，請再試一次或改用鍵盤。";
                feedbackEl.className = "text-center text-xl md:text-2xl font-bold h-[2.5rem] flex items-center justify-center mb-2 text-orange-500";
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        } 
        // 情境 2：沒有筆跡，直接送出輸入框內的值 (鍵盤打字)
        else {
            if (answerInput.value.trim() === '') {
                feedbackEl.innerText = "請先打字或手寫喔！";
                feedbackEl.className = "text-center text-xl md:text-2xl font-bold h-[2.5rem] flex items-center justify-center mb-2 text-gray-500";
                return;
            }
            submitAnswer(answerInput.value);
        }
    }

    function submitAnswer(rawInput) {
        if (!currentWord || locked) return;

        const userAnswer = normalize(rawInput);
        const correctAnswer = normalize(currentWord.en);
        const feedbackEl = document.getElementById('feedback');

        if (userAnswer === correctAnswer) {
            locked = true;
            currentWord.correctCount++;
            feedbackEl.innerText = "⭕ 答對了！";
            feedbackEl.className = "text-center text-xl md:text-2xl font-bold h-[2.5rem] flex items-center justify-center mb-2 text-green-500";
            setTimeout(nextQuestion, 800);
        } else {
            feedbackEl.innerText = `❌ 答錯囉！ (輸入: ${userAnswer || '空白'})`;
            feedbackEl.className = "text-center text-xl md:text-2xl font-bold h-[2.5rem] flex items-center justify-center mb-2 text-red-500";
            clearAll(); // 答錯全數清空方便重來
        }
    }
</script>
</body>
