<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英語千字王-11 互動測驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Tesseract.js 進行手寫辨識 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        /* 防止在手寫板上畫畫時螢幕跟著捲動 */
        #drawing-pad {
            touch-action: none;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <div class="max-w-2xl mx-auto p-4 py-8">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">英語千字王 - 第十一關</h1>

        <!-- 設定區域 -->
        <div id="setup-section" class="bg-white p-6 rounded-xl shadow-md text-center">
            <h2 class="text-xl mb-4 font-semibold">測驗設定</h2>
            <div class="mb-4">
                <label for="target-count" class="mr-2">每個單字需要答對次數：</label>
                <input type="number" id="target-count" value="1" min="1" max="10" class="border-2 border-blue-300 rounded px-3 py-1 w-20 text-center text-lg focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="startGame()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                開始測驗
            </button>
        </div>

        <!-- 測驗區域 -->
        <div id="quiz-section" class="bg-white p-6 rounded-xl shadow-md hidden">
            <div class="flex justify-between items-center mb-4 text-sm text-gray-500">
                <span id="progress-text">剩餘單字：25</span>
                <span id="current-word-target">目標次數：0/1</span>
            </div>
            
            <div class="text-center mb-6">
                <p class="text-gray-500 mb-1">請拼出以下中文的英文單字：</p>
                <h2 id="question-text" class="text-4xl font-bold text-gray-800 tracking-wide">中文</h2>
            </div>

            <!-- 鍵盤輸入區 -->
            <div class="mb-6 flex justify-center">
                <input type="text" id="answer-input" placeholder="點此打字..." class="border-b-4 border-blue-400 bg-gray-50 text-center text-2xl py-2 px-4 w-full max-w-xs focus:outline-none focus:border-blue-600 transition" onkeypress="handleKeyPress(event)">
                <button onclick="submitAnswer()" class="ml-4 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                    送出
                </button>
            </div>

            <div id="feedback" class="text-center text-xl font-bold h-8 mb-4"></div>

            <hr class="my-6">

            <!-- 手寫板區域 -->
            <div class="text-center">
                <h3 class="text-lg font-semibold text-gray-600 mb-2">或使用手寫輸入</h3>
                <div class="flex justify-center mb-3">
                    <canvas id="drawing-pad" width="300" height="150" class="border-2 border-gray-300 rounded-lg bg-white shadow-inner"></canvas>
                </div>
                <div class="flex justify-center gap-4">
                    <button onclick="clearCanvas()" class="bg-gray-400 hover:bg-gray-500 text-white py-1 px-4 rounded transition duration-200">清除重寫</button>
                    <button id="ocr-btn" onclick="recognizeAndSubmit()" class="bg-indigo-500 hover:bg-indigo-600 text-white py-1 px-4 rounded transition duration-200 flex items-center">
                        <span id="ocr-btn-text">辨識並送出解答</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 完成畫面 -->
        <div id="finish-section" class="bg-white p-8 rounded-xl shadow-md hidden text-center">
            <h2 class="text-4xl font-bold text-green-500 mb-4">🎉 恭喜過關！</h2>
            <p class="text-lg mb-6">你已經成功將所有單字練習完畢！</p>
            <button onclick="location.reload()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                重新測驗
            </button>
        </div>
    </div>

    <script>
        // 詞彙表資料
        const rawVocab = [
            { en: "one", zh: "一/一個" },
            { en: "open", zh: "打開" },
            { en: "or", zh: "或者" },
            { en: "orange", zh: "柳丁" },
            { en: "out", zh: "出去" },
            { en: "outside", zh: "外面" },
            { en: "over", zh: "在..之上;結束" },
            { en: "pants", zh: "褲子" },
            { en: "paper", zh: "紙" },
            { en: "park", zh: "公園" },
            { en: "party", zh: "宴會" },
            { en: "pass", zh: "通過;經過" },
            { en: "PE", zh: "體育課" },
            { en: "pen", zh: "筆" },
            { en: "pencil", zh: "鉛筆" },
            { en: "pet", zh: "寵物" },
            { en: "piano", zh: "鋼琴" },
            { en: "pick", zh: "撿拾" },
            { en: "pie", zh: "派" },
            { en: "pig", zh: "豬" },
            { en: "pink", zh: "粉紅色" },
            { en: "pizza", zh: "披薩" },
            { en: "play", zh: "玩" },
            { en: "p.m.", zh: "午後" },
            { en: "poor", zh: "貧窮的;可憐的" }
        ];

        let wordPool = [];
        let currentWord = null;
        let targetPerWord = 1;

        // 手寫板相關變數
        const canvas = document.getElementById('drawing-pad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        // 初始化手寫板設定
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'black';
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height); // 填滿白底供辨識

        // --- 遊戲邏輯 ---

        function startGame() {
            targetPerWord = parseInt(document.getElementById('target-count').value) || 1;
            if (targetPerWord < 1) targetPerWord = 1;

            wordPool = rawVocab.map(word => ({
                ...word,
                correctCount: 0
            }));

            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            
            nextQuestion();
        }

        function nextQuestion() {
            // 過濾掉已經達到目標次數的單字
            wordPool = wordPool.filter(w => w.correctCount < targetPerWord);

            if (wordPool.length === 0) {
                document.getElementById('quiz-section').classList.add('hidden');
                document.getElementById('finish-section').classList.remove('hidden');
                return;
            }

            // 隨機抽選
            const randomIndex = Math.floor(Math.random() * wordPool.length);
            currentWord = wordPool[randomIndex];

            // 更新 UI
            document.getElementById('question-text').innerText = currentWord.zh;
            document.getElementById('progress-text').innerText = `剩餘單字：${wordPool.length}`;
            document.getElementById('current-word-target').innerText = `此題進度：${currentWord.correctCount}/${targetPerWord}`;
            
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();
            document.getElementById('feedback').innerText = '';
            clearCanvas();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                submitAnswer();
            }
        }

        function submitAnswer(externalText = null) {
            if (!currentWord) return;

            // 優先使用傳入的文字（手寫辨識結果），否則抓取輸入框文字
            let rawInput = externalText !== null ? externalText : document.getElementById('answer-input').value;
            let userAnswer = rawInput.trim().toLowerCase();
            let correctAnswer = currentWord.en.toLowerCase();

            const feedbackEl = document.getElementById('feedback');

            if (userAnswer === correctAnswer) {
                currentWord.correctCount++;
                feedbackEl.innerText = "⭕ 答對了！";
                feedbackEl.className = "text-center text-xl font-bold h-8 mb-4 text-green-500";
                
                // 答對後短暫延遲自動換下一題
                setTimeout(() => {
                    nextQuestion();
                }, 800);
            } else {
                feedbackEl.innerText = `❌ 答錯囉！再試一次。 (辨識/輸入: ${userAnswer})`;
                feedbackEl.className = "text-center text-xl font-bold h-8 mb-4 text-red-500";
            }
        }

        // --- 手寫板與 OCR 邏輯 ---

        function startDrawing(e) {
            isDrawing = true;
            draw(e);
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); // 防止平板捲動

            // 處理滑鼠與觸控座標
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // 綁定手寫事件 (支援滑鼠與觸控)
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        function clearCanvas() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // 手寫辨識並「直接送出判斷」的核心修改點
// 手寫辨識並「直接送出判斷」的核心修改點 (嚴格比對版)
        async function recognizeAndSubmit() {
            const btnText = document.getElementById('ocr-btn-text');
            const originalText = btnText.innerText;
            btnText.innerText = "辨識中...";
            document.getElementById('ocr-btn').disabled = true;

            try {
                // 保留優化 1：前處理，建立一個帶有白邊的虛擬 Canvas，避免字體頂到邊緣
                const padCanvas = document.createElement('canvas');
                const padding = 40; // 四周加上 40px 白邊
                padCanvas.width = canvas.width + padding * 2;
                padCanvas.height = canvas.height + padding * 2;
                const pctx = padCanvas.getContext('2d');
                
                // 填滿白底並將原圖畫在正中央
                pctx.fillStyle = 'white';
                pctx.fillRect(0, 0, padCanvas.width, padCanvas.height);
                pctx.drawImage(canvas, padding, padding);

                // 保留優化 2：設定 Tesseract 白名單與單字模式 (PSM 8)
                const result = await Tesseract.recognize(padCanvas, 'eng', {
                    tessedit_char_whitelist: 'abcdefghijklmnopqrstuvwxyz.',
                    tessedit_pageseg_mode: '8' 
                });
                
                // 取得辨識結果並清理格式
                let recognizedText = result.data.text.trim().toLowerCase();
                
                // 填入輸入框給使用者看
                document.getElementById('answer-input').value = recognizedText;
                
                // 移除容錯機制，直接將 OCR 結果送出進行 100% 嚴格比對
                submitAnswer(recognizedText);

            } catch (err) {
                console.error(err);
                alert("辨識失敗，請再試一次或使用鍵盤輸入。");
            } finally {
                btnText.innerText = originalText;
                document.getElementById('ocr-btn').disabled = false;
            }
        }
    </script>
</body>
</html>
